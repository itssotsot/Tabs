appId: com.itssotsot.tabs
productName: Tabs
directories:
  buildResources: build
  output: dist
# castLabs' Electron build, which includes Widevine DRM.
electronDownload:
  mirror: https://github.com/castlabs/electron-releases/releases/download/
afterPack: build/after-pack.cjs
afterSign: build/after-sign.cjs
# Newer toolsets ship arm64-native makensis/rcedit, so Windows builds work on
# Apple Silicon without Rosetta.
toolsets:
  nsis: 1.2.1
  winCodeSign: 1.1.0
files:
  - out/**
  - package.json
  - '!build/**'
asarUnpack:
  - resources/**
# Updates: `npm run release` uploads the installers and the latest*.yml files the app checks
# (src/main/updater.ts) to this public repo's GitHub Releases.
publish:
  provider: github
  owner: itssotsot
  repo: tabs
  # scripts/release.mjs makes the draft first and publishes it once every file is up.
  releaseType: draft
protocols:
  - name: Web
    schemes: [http, https]
mac:
  category: public.app-category.productivity
  # The updater picks this Mac's DMG by the arch in its name.
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Apple Silicon only (since 0.3.1): Intel Macs stay on 0.3.0. The zip is what makes electron-builder
  # write latest-mac.yml, which the updater reads (it then downloads the DMG).
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  extendInfo:
    NSCameraUsageDescription: Websites you visit can ask to use your camera.
    NSMicrophoneUsageDescription: Websites you visit can ask to use your microphone.
    NSLocationUsageDescription: Websites you visit can ask for your location.
    CFBundleDocumentTypes:
      - CFBundleTypeName: HTML document
        CFBundleTypeRole: Viewer
        LSItemContentTypes: [public.html]
win:
  # Intel/AMD only (since 0.3.1). Windows on ARM runs it emulated, and ARM installs update to it.
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
